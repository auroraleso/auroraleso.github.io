main>header{position:static}.pocket-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;text-align:left;gap:12px;width:100%;margin-bottom:8px;background:#fafbf8;padding:12px}.pocket-row small{display:block}.pocket-row b{overflow-wrap:anywhere}.pocket-row>span:last-child{font-size:25px;color:#2e624b}.pocket-hero{padding:18px 22px}.pocket-hero strong{font-size:clamp(28px,7vw,42px);margin:4px 0 10px}.completed-pockets{margin:14px 0}.completed-pockets summary{font-weight:650;color:#2e624b;padding:7px 0}</style><body><main><header><div class="brand">Filo <small> / Bilancio personale</small></div><button id="add" class="primary">＋ Movimento</button></header><nav aria-label="Sezioni"><button data-tab="reference-budget">Piano personale</button><button data-tab="reference-pac">Piano PAC</button><button data-tab="goals">Pocket virtuali</button></nav><div class="top"><h1 id="title"></h1><label>Mese <input type="month" id="period"></label></div><section id="screen"></section><p id="status" role="status"></p></main><dialog id="dialog" aria-labelledby="modal-title"><form id="form" class="form"></form></dialog><input type="file" accept=".json,.html,.htm" id="upload" hidden><script src="./plans.js?v=17"></script><script>
const byId = id => document.getElementById(id);
const key = 'filo-bilancio-v1';
const money = cents => new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(cents / 100);
const escape = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const date = () => new Date().toLocaleDateString('sv-SE',{timeZone:'Europe/Rome'});
const uid = () => globalThis.crypto?.randomUUID?.() ?? Date.now().toString(36)+Math.random().toString(36).slice(2);
const empty = () => ({version:1,moves:[],rules:[],goals:[],income:0});
let state = empty(), tab = ({'#personale':'reference-budget','#pac':'reference-pac','#pocket':'goals','#proiezioni':'sim','#strumenti':'home'})[location.hash] || 'goals', filter = 'all';
try { const saved = localStorage.getItem(key); if(saved) state = validate(JSON.parse(saved)); }
catch { byId('status').textContent = 'Archivio locale non disponibile. Puoi usare un backup per salvare i dati.'; }
byId('period').value = date().slice(0,7);
const period = () => byId('period').value || date().slice(0,7);
const monthList = () => state.moves.filter(item => item.date.startsWith(period())).sort((a,b)=>b.date.localeCompare(a.date));
const sum = (list, kind) => list.filter(item=>item.kind===kind).reduce((total,item)=>total+item.amount,0);
const expense = (list, category, extra = false) => sum(list.filter(item=>!extra ? item.category===category : item.extra),'out');
const palette = ['#3570c5','#df9b65','#5b9f8a','#826ac3','#508ba7','#bf627d'];
function save(next,message) {
  state = next;
  try { localStorage.setItem(key,JSON.stringify(state)); byId('status').textContent=message; }
  catch { byId('status').textContent='Modifica in memoria. Scarica un backup prima di chiudere.'; }
  render();
}
function validate(data) {
  const cash = n => Number.isSafeInteger(n) && n>=0 && n<=1e11;
  const label = s => typeof s==='string' && s.trim() && s.length<=100;
  const unique = (list,field) => new Set(list.map(x=>x[field])).size===list.length;
  const day = s => typeof s==='string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && Number.isFinite(Date.parse(s)) && new Date(s).toISOString().slice(0,10)===s;
  if(data?.version!==1 || !cash(data.income) || !Array.isArray(data.rules) || !Array.isArray(data.goals) || !Array.isArray(data.moves) ||
    !data.rules.every(x=>x && label(x.name) && cash(x.amount)) || !unique(data.rules,'name') ||
    !data.goals.every(x=>x && label(x.name) && label(x.id) && cash(x.target) && x.target>0 && cash(x.start) && Number.isInteger(x.weight) && x.weight>=1 && x.weight<=100) || !unique(data.goals,'id') ||
    !data.moves.every(x=>x && label(x.id) && day(x.date) && cash(x.amount) && x.amount>0 && label(x.note) && ['in','out','save'].includes(x.kind) && typeof x.extra==='boolean' &&
     (x.kind==='save' ? data.goals.some(g=>g.id===x.category) : label(x.category))) || !unique(data.moves,'id')) throw Error('Formato del backup non valido.');
  return data;
}
function convertPlan(old) {
  if(!Array.isArray(old?.categories) || typeof old.income!=='number') throw Error('Piano di risparmio non riconosciuto.');
  return validate({...empty(),income:Math.round(old.income*100),rules:old.categories.flatMap(c=>c.items.map(i=>({name:i.label,amount:Math.round(i.value*100)})))});
}
function metrics(list) {
  const income=sum(list,'in'), out=sum(list,'out'), saved=sum(list,'save');
  const remaining=state.rules.reduce((n,r)=>n+Math.max(0,r.amount-expense(list.filter(item=>!item.extra),r.name)),0);
  return {income,out,saved,remaining,balance:income-out-saved, available:Math.max(0,income-out-saved-remaining)};
}
const btn=(name,label,classes='')=>'<button type="button" class="'+classes+'" data-action="'+name+'">'+label+'</button>';
const row=(a,b)=>'<div class="row"><div>'+a+'</div><div>'+b+'</div></div>';
const card=(title,body)=>'<article class="card"><h2>'+title+'</h2>'+body+'</article>';
const track=(n,limit)=>'<div class="track"><div class="fill '+(n>limit?'bad':'')+'" style="width:'+Math.min(100,limit ? n/limit*100 : n?100:0)+'%"></div></div>';
function allocation(amount,goals) {
  const total=goals.reduce((n,g)=>n+g.weight,0);
  if(!total || amount<=0) return [];
  let left=amount;
  const parts=goals.map(goal=>{const exact=amount*goal.weight/total, value=Math.floor(exact);left-=value;return {goal,value,remainder:exact-value};});
  parts.slice().sort((a,b)=>b.remainder-a.remainder).slice(0,left).forEach(part=>part.value++);
  return parts;
}
function chart(list,total) {
  const cats=Object.entries(list.filter(x=>x.kind==='out').reduce((acc,x)=>{acc[x.category]=(acc[x.category]||0)+x.amount;return acc;},Object.create(null))).sort((a,b)=>b[1]-a[1]);
  if(!total) return '<p class="muted">Le tue spese appariranno qui.</p>';
  let offset=0;
  const segments=cats.map(([,n],i)=>{const start=offset;offset+=n/total*100;return palette[i%palette.length]+' '+start+'% '+offset+'%';});
  return '<div class="donut" style="background:conic-gradient('+segments.join(',')+')" aria-hidden="true"><span>'+money(total)+'</span></div>'+cats.map(([name,n],i)=>row('<span class="dot" style="background:'+palette[i%palette.length]+'"></span>'+escape(name),money(n))).join('');
}
function history() {
  const [year,month]=period().split('-').map(Number);
  const months=Array.from({length:6},(_,i)=>{
    const d=new Date(year,month-6+i,1);
    const p=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    return {name:d.toLocaleDateString('it-IT',{month:'short'}),...metrics(state.moves.filter(x=>x.date.startsWith(p)))};
  });
  const max=Math.max(1,...months.flatMap(x=>[x.income,x.out]));
  return '<div class="bars">'+months.map(m=>'<div class="monthbar" title="'+escape(m.name+' · entrate '+money(m.income)+' · spese '+money(m.out))+'"><div class="pair"><i style="height:'+m.income/max*100+'%"></i><i style="height:'+m.out/max*100+'%"></i></div>'+escape(m.name)+'</div>').join('')+'</div><small>Verde · entrate &nbsp; Ambra · spese</small>'+ '<details><summary>Valori mensili</summary>'+months.map(m=>row(escape(m.name),money(m.income)+' / '+money(m.out))).join('')+'</details>';
}
function moveRows(list) {
  return list.map(x=>row('<b>'+escape(x.note)+'</b><small>'+escape(x.date.split('-').reverse().join('/')+' · '+(x.kind==='save'?(state.goals.find(g=>g.id===x.category)?.name||'Risparmi'):x.category)+(x.extra?' · Extra':''))+'</small>',(x.kind==='in'?'+':'−')+money(x.amount)+' '+btn('move:'+escape(x.id),'Modifica'))).join('') || '<p class="muted">Nessun movimento per questa selezione.</p>';
}
function render() {
  document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.tab===tab)));
  byId('title').textContent={home:'Il tuo mese',moves:'Movimenti',plan:'Budget mensile',goals:'I tuoi Pocket',data:'I tuoi dati'}[tab];
  const list=monthList(), m=metrics(list);
  const parts=allocation(m.available,state.goals);

const baseValidate=validate;
validate=function(data){
  if(data?.profile!==undefined && (typeof data.profile!=='string'||data.profile.length>60))throw Error('Nome del profilo non valido.');
  if(data?.welcomed!==undefined && typeof data.welcomed!=='boolean')throw Error('Configurazione non valida.');
    if(data?.opening!==undefined && (!Number.isSafeInteger(data.opening)||data.opening<0||data.opening>1e11))throw Error('Risparmi iniziali non validi.');
  if(data?.recurring!==undefined && (!Array.isArray(data.recurring)||!data.recurring.every(r=>r&&typeof r.name==='string'&&r.name.trim()&&r.name.length<=100&&Number.isSafeInteger(r.amount)&&r.amount>0&&r.amount<=1e11&&Number.isInteger(r.every)&&r.every>=1&&r.every<=36&&/^\d{4}-(0[1-9]|1[0-2])$/.test(r.first))))throw Error('Spese periodiche non valide.');
  const checked=baseValidate(data);
  const isCash=n=>Number.isSafeInteger(n)&&n>=0&&n<=1e11;
  const isDate=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)&&Number.isFinite(Date.parse(s))&&new Date(s).toISOString().slice(0,10)===s;
  const pending=checked.pendingIncome;
  if(pending!==undefined&&(!Array.isArray(pending)||!pending.every(x=>x&&typeof x.id==='string'&&/^[\w-]+$/.test(x.id)&&typeof x.note==='string'&&x.note.trim()&&x.note.length<=100&&isCash(x.amount)&&x.amount>0&&(x.expected===''||isDate(x.expected)))||new Set(pending.map(x=>x.id)).size!==pending.length))throw Error('Entrate attese non valide.');
  const batches=checked.savingBatches||[];
  if(!Array.isArray(batches)||!batches.every(b=>b&&/^\d{4}-(0[1-9]|1[0-2])$/.test(b.month)&&isCash(b.amount)&&b.amount>0&&isCash(b.free)&&Array.isArray(b.parts)&&b.parts.every(p=>p&&isCash(p.amount)&&p.amount>0&&checked.goals.some(g=>g.id===p.id))&&b.parts.reduce((n,p)=>n+p.amount,b.free)===b.amount))throw Error('Ripartizioni dei risparmi non valide.');
  if(checked.goals.some(g=>g.monthly!==undefined&&!isCash(g.monthly))||(checked.emergency!==undefined&&!isCash(checked.emergency)))throw Error('Quote o fondo di emergenza non validi.');
  const plan=checked.cashPlan;
  if(plan!==undefined&&(!plan||!isDate(plan.payday)||!isCash(plan.balance)||!isCash(plan.committed)))throw Error('Stima dello spendibile non valida.');
  if(checked.goals.some(g=>g.reserved!==undefined&&(!Number.isSafeInteger(g.reserved)||g.reserved<0)) ||
    checked.goals.reduce((n,g)=>n+(g.reserved||0),0)+(checked.emergency||0)>(checked.opening||0)+batches.reduce((n,b)=>n+b.free,0))throw Error('Il totale destinato ai Pocket supera i risparmi iniziali.');
  return checked;
};

function splitSavings(amount,month){
  let free=amount;
  const parts=[];
  const batches=(state.savingBatches||[]).filter(b=>b.month===month);
  const ordered=state.goals.slice().sort((a,b)=>b.weight-a.weight);
  for(const goal of ordered){
    const used=batches.reduce((n,b)=>n+b.parts.filter(p=>p.id===goal.id).reduce((total,p)=>total+p.amount,0),0);
    const share=Math.min(free,Math.max(0,(goal.monthly||0)-used),Math.max(0,goal.target-pocketBalance(goal)));
    if(share>0){parts.push({id:goal.id,amount:share});free-=share;}
  }
  return {month,amount,parts,free};
}

function drawProjection(){
  const s=scenario, margin=s.income-s.bills-s.extra;
    const monthNumber=p=>{const [y,m]=p.split('-').map(Number);return y*12+m-1;};
  const origin=monthNumber(period());
  let recurringTotal=0,pacTotal=0;
  const series=[s.start];
  for(let i=0;i<s.months;i++){
    const scheduled=(state.recurring||[]).reduce((sum,r)=>{
      const elapsed=origin+i-monthNumber(r.first);
      if(elapsed<0||elapsed%r.every!==0)return sum;
      if(r.pac)pacTotal+=r.amount;
      else recurringTotal+=r.amount;
      return sum+r.amount;
    },0);

    series.push(series.at(-1)+margin-scheduled-(i===0?s.oneoff:0));
  }
  const lo=Math.min(0,...series),hi=Math.max(0,...series),spread=hi-lo||1;
  const y=value=>122-(value-lo)/spread*104;
  const points=series.map((value,i)=>(12+296*i/s.months)+','+y(value)).join(' ');
  const firstNegative=series.findIndex(value=>value<0);
  const lowPoint=row('Saldo minimo previsto',money(Math.min(...series)))+
    (firstNegative>0?row('Primo mese in negativo','<b class="bad">Mese '+firstNegative+'</b>'):'');
  const summary=row('Margine mensile prima delle scadenze',money(margin))+row('Spese periodiche nel periodo',money(recurringTotal))+row('Versamenti PAC previsti',money(pacTotal))+row('Saldo dopo '+s.months+' mesi',money(series.at(-1)))+lowPoint;
  const baseline=' <line x1="12" x2="308" y1="'+y(0)+'" y2="'+y(0)+'" stroke="#a8a093" stroke-dasharray="4 4"/>';
  byId('projection').innerHTML='<h2>Saldo previsto</h2><svg viewBox="0 0 320 138" width="100%" role="img" aria-label="Andamento del saldo previsto">'+baseline+
    '<polyline fill="none" stroke="#426452" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="'+points+'"/></svg>'+
    '<div class="line muted"><span>Oggi</span><span>Mese '+s.months+'</span></div>'+summary+
    '<details><summary>Valori mensili</summary>'+series.map((n,i)=>row(i?'Mese '+i:'Oggi',money(n))).join('')+'</details>';
}
function setup(){
  const first=!state.welcomed;
  modal(first?'Benvenuta o benvenuto in Filo':'Il tuo profilo',

    '<fieldset><legend>Pocket da creare (facoltativi)</legend>'+[1,2,3].map(i=>
      '<div class="setup-pocket">'+field('pocket'+i,'Nome Pocket '+i,'text','','maxlength="100"')+
      field('initial'+i,'Già nel Pocket','number','','min="0" max="1000000000" step="0.01"')+field('target'+i,'Obiettivo in euro','number','','min="0.01" max="1000000000" step="0.01"')+'</div>').join('')+'</fieldset>',
    f=>{
      const added=[];
      for(let i=1;i<=3;i++){
        const name=f.get('pocket'+i).trim(),target=cents(f,'target'+i),start=cents(f,'initial'+i);
        if(!name&&!target&&!start)continue;
        if(!name||!target)throw Error('Inserisci nome e obiettivo per ciascun Pocket.');
        added.push({id:uid(),name,target,start,weight:1});
      }
      scenario=null;
      save(validate({...state,profile:f.get('profile').trim(),welcomed:true,opening:cents(f,'opening'),income:cents(f,'income'),goals:[...state.goals,...added]}),'Profilo salvato.');
    });
  const dialog=byId('dialog');
  if(first){
    byId('cancel').textContent='Più tardi';
    const skip=()=>save({...state,welcomed:true},'Puoi completare il profilo da Backup.');
    byId('cancel').onclick=()=>{skip();dialog.close();};
    dialog.addEventListener('cancel',skip,{once:true});
    dialog.addEventListener('close',()=>dialog.removeEventListener('cancel',skip),{once:true});
  }
}

  if(action==='pac'||action==='recurring'||action?.startsWith('recurring:')){

      number('every','Ogni quanti mesi?',old?.every||1,'1','1','36')+
      field('first','Prima scadenza','month',old?.first||period(),'required'),
      f=>{
        const entry={name:f.get('name').trim(),pac,amount:cents(f,'amount'),every:Number(f.get('every')),first:f.get('first')};
        const recurring=old?entries.map((r,i)=>i===index?entry:r):[...entries,entry];
        scenario=null;save(validate({...state,recurring}),pac?'PAC salvato.':'Scadenza salvata.');
      },old?()=>save({...state,recurring:entries.filter((r,i)=>i!==index)},'Scadenza eliminata.'):null);
  }
  if(action==='reset-sim'){scenario=simDefaults();render();}
});
